[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collector"
version = "0.1.0"
description = "India F&O market-data collector: NSE archive backfill and (later) live Fyers capture. Personal use."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tzdata",
    "numpy",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "black",
    "mypy",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs<2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: tests that call the real NSE archive (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
